<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TechRadar 결정 지도</title>
<style>
/* 배치: 1600×900 무대를 화면에 맞춰 한 번만 맞춘다. 왼쪽 원형 레이더, 오른쪽 큰 글자 카드, 아래 범례/날짜 띠 */
:root{
  --paper:#FAFAF6; --ink:#111111; --soft:#55554F; --line:#C9C8C0; --wash:#EEEDE6;
  --q1:#0A4BD0; --q2:#D4241C; --q3:#FFC800; --q4:#0A7A3C;
  --sans:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#fit{position:absolute;left:0;top:0;transform-origin:0 0}
#stage{position:relative;width:1600px;height:900px;background:var(--paper);overflow:hidden}

/* 머리띠 */
#mast{position:absolute;left:30px;right:24px;top:0;height:54px;display:flex;align-items:center;gap:18px;border-bottom:3px solid var(--ink)}
#mast h1{font-size:22px;font-weight:900;letter-spacing:.5px;margin:0;white-space:nowrap}
#mast .sub{font-size:14px;color:var(--soft);white-space:nowrap}
#acts{margin-left:auto;display:flex;gap:0}
#acts button{font-size:14px;font-weight:700;padding:7px 10px;border:2px solid var(--ink);margin-left:-2px;background:var(--paper);white-space:nowrap}
#acts button[aria-current="true"]{background:var(--ink);color:var(--paper)}
#acts button small{font-weight:400;font-size:12px;margin-left:4px}
#modeBtn{font-size:14px;font-weight:800;padding:7px 12px;border:2px solid var(--ink);background:var(--q3)}

/* 레이더 */
#radarWrap{position:absolute;left:30px;top:64px;width:694px;height:694px;transition:opacity .3s}
#radar{width:100%;height:100%;display:block}
.front #radarWrap{opacity:.32}
.blip{cursor:pointer;transition:opacity .3s}
.blip.dim{opacity:.13}
.blip.mid{opacity:.42}
.blip.off{opacity:0;pointer-events:none}
.blip.sel .shape{stroke-width:4}
.blip text{font-size:12.5px;font-weight:800;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.ringname{font-size:13px;font-weight:800;text-anchor:middle;dominant-baseline:central;fill:var(--ink)}
.qname{font-size:21px;font-weight:900;fill:var(--ink)}
.qsub{font-size:12.5px;fill:var(--soft);font-weight:600}
.ringfill{fill:none;transition:fill .3s}
.ringfill.lit{fill:var(--wash)}
.qarc{transition:opacity .3s}
.qarc.dim{opacity:.18}

/* 레이더 아래: 범례 또는 날짜 띠 */
#under{position:absolute;left:30px;top:764px;width:694px;height:86px}
#legend{display:grid;grid-template-columns:1fr 1fr;gap:2px 18px;font-size:12.5px;line-height:1.35;padding-top:6px}
#legend b{font-weight:800}
#legend svg{vertical-align:-4px}
#band{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;height:86px;align-items:end}
#band button{position:relative;height:86px;border-bottom:3px solid var(--ink);text-align:left}
#band .bar{position:absolute;left:0;right:0;bottom:0;background:var(--line)}
#band button[aria-current="true"] .bar{background:var(--ink)}
#band button.past .bar{background:var(--soft)}
#band .lab{position:absolute;left:4px;top:0;font-size:13px;font-weight:800;line-height:1.2}
#band .lab small{display:block;font-weight:600;color:var(--soft);font-size:12px}

/* 카드 */
#card{position:absolute;left:752px;top:64px;width:824px;height:786px;padding:6px 0 0 0;display:flex;flex-direction:column;gap:12px;background:var(--paper)}
.front #card{left:330px;width:1246px;padding-left:26px;border-left:3px solid var(--ink)}
.eyebrow{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:800}
.eyebrow .act{background:var(--ink);color:var(--paper);padding:3px 10px}
.eyebrow .sec{color:var(--soft);font-weight:600}
#card h2{font-size:58px;line-height:1.1;font-weight:900;letter-spacing:-1.5px;margin:0;text-wrap:balance;word-break:keep-all}
#card h2.m{font-size:46px}
#card h2.s{font-size:38px;letter-spacing:-1px}
.body{font-size:20px;line-height:1.45;display:flex;flex-direction:column;gap:10px;min-height:0;word-break:keep-all}
.body p{margin:0}
.body ul,.body ol{margin:0;padding-left:1.15em;display:flex;flex-direction:column;gap:4px}
.small{font-size:16px;color:var(--soft)}
.src{font-size:14px;color:var(--soft);line-height:1.35;margin-top:auto;border-top:1px solid var(--line);padding-top:6px}
.tag{display:inline-block;font-size:13px;font-weight:800;border:2px solid var(--ink);padding:0 6px;margin-right:6px;vertical-align:2px;white-space:nowrap}
.tag.k{background:var(--ink);color:var(--paper)}
.tag.y{background:var(--q3)}
blockquote{margin:0;padding:6px 0 6px 18px;border-left:10px solid var(--ink);font-size:40px;font-weight:900;line-height:1.15;letter-spacing:-1px}
blockquote cite{display:block;font-size:16px;font-weight:600;font-style:normal;color:var(--soft);letter-spacing:0;margin-top:6px}
table.t{border-collapse:collapse;width:100%;font-size:18px;line-height:1.3}
table.t th,table.t td{text-align:left;padding:6px 10px 6px 0;border-bottom:1px solid var(--line);vertical-align:top}
table.t th{font-size:14px;color:var(--soft);font-weight:700;border-bottom:2px solid var(--ink)}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums;font-weight:800;padding-right:14px}
.nums{display:flex;flex-wrap:wrap;gap:8px 26px}
.nums div{font-size:15px;color:var(--soft);font-weight:600;line-height:1.2}
.nums b{display:block;font-size:44px;font-weight:900;color:var(--ink);letter-spacing:-1px;font-variant-numeric:tabular-nums;line-height:1.05}
.chain{display:flex;gap:0;align-items:stretch}
.chain div{flex:1;border:3px solid var(--ink);margin-left:-3px;padding:8px 10px;font-size:17px;line-height:1.3}
.chain div:first-child{margin-left:0}
.chain b{display:block;font-size:22px;font-weight:900}
.steps6{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.steps6 div{border-top:6px solid var(--ink);padding-top:4px;font-size:16.5px;line-height:1.3}
.steps6 b{display:block;font-size:19px}
.steps6 .bad{border-top-color:var(--q2)}
.steps6 .ok{border-top-color:var(--q4)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cell{border:3px solid var(--ink);padding:10px 14px}
.cell .k{font-size:15px;font-weight:800}
.cell .v{font-size:30px;font-weight:900;line-height:1.2;min-height:38px}
.ed{border-bottom:2px dotted var(--soft)}
.editing .ed{outline:2px dashed var(--q2);outline-offset:2px;background:#fff;cursor:text}
.shots{display:flex;flex-direction:column;gap:6px}
.shots figure{margin:0}
.shots img{display:block;width:100%;max-width:1010px;border:2px solid var(--ink)}
.shots figcaption{font-size:14px;color:var(--soft);margin-top:2px}
.lit{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lit .cap{font-size:13px;font-weight:800;color:var(--soft);margin-right:2px}
.chip{font-size:14px;font-weight:700;border:2px solid var(--ink);padding:2px 8px 2px 4px;display:inline-flex;align-items:center;gap:5px;background:var(--paper);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.chip .no{display:inline-block;min-width:22px;text-align:center;font-size:12px;font-weight:900;padding:1px 2px}
.c0{background:var(--q1);color:#fff}.c1{background:var(--q2);color:#fff}.c2{background:var(--q3);color:#111}.c3{background:var(--q4);color:#fff}
.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.minis figure{margin:0;border-top:6px solid var(--ink);padding-top:4px}
.minis svg{width:100%;height:auto;display:block}
.minis figcaption{font-size:16px;line-height:1.3}
.minis figcaption b{font-size:22px;font-weight:900}
.minis .pr{font-size:30px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.day h3{font-size:30px;font-weight:900;margin:0;letter-spacing:-.5px}
.day ul{font-size:18.5px}

/* 탐색 모드 */
.filters{display:grid;grid-template-columns:70px 1fr;gap:6px 8px;align-items:center;font-size:14px;font-weight:800}
.filters .row{display:flex;flex-wrap:wrap;gap:6px}
#xlist{display:grid;grid-template-columns:repeat(3,1fr);gap:3px 8px;align-content:start;font-size:14px}
#xlist button{display:flex;gap:6px;align-items:center;text-align:left;padding:2px 2px;min-width:0;border-bottom:1px solid var(--line)}
#xlist button span.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#xlist button[aria-current="true"]{background:var(--ink);color:var(--paper)}
#xlist .no{flex:none;min-width:22px;text-align:center;font-size:12px;font-weight:900}

/* 점 카드 */
#detail{position:absolute;left:752px;bottom:50px;width:824px;border:3px solid var(--ink);background:var(--paper);padding:12px 16px 12px 16px;z-index:5}
#detail h3{margin:0 40px 4px 0;font-size:27px;font-weight:900;line-height:1.2;letter-spacing:-.5px;word-break:keep-all}
#detail p{margin:0 0 6px 0;font-size:18px;line-height:1.4;word-break:keep-all}
#detail dl{margin:0;display:grid;grid-template-columns:64px 1fr 64px 1fr;gap:2px 8px;font-size:15px;line-height:1.35}
#detail dt{font-weight:800;color:var(--soft)}
#detail dd{margin:0}
#detail .x{position:absolute;right:8px;top:6px;font-size:16px;font-weight:900;border:2px solid var(--ink);padding:0 8px}

/* 바닥 줄 */
#foot{position:absolute;left:30px;right:24px;bottom:0;height:44px;border-top:3px solid var(--ink);display:flex;align-items:center;gap:14px;font-size:15px}
#spk{font-weight:900;background:var(--ink);color:var(--paper);padding:3px 10px;white-space:nowrap}
#hand{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
#pos{margin-left:auto;font-weight:800;white-space:nowrap}
#timer{font-variant-numeric:tabular-nums;font-weight:800;white-space:nowrap;border:2px solid var(--ink);padding:1px 8px}
#timer.run{background:var(--ink);color:var(--paper)}
#timer.over{background:var(--q2);color:#fff;border-color:var(--q2)}
#keys{color:var(--soft);font-size:13px;white-space:nowrap}

#notes{position:absolute;left:752px;bottom:50px;width:824px;background:var(--ink);color:var(--paper);padding:12px 16px;font-size:17px;line-height:1.45;z-index:6}
#notes b{color:var(--q3)}
#help{position:absolute;inset:54px 24px 44px 30px;background:var(--paper);z-index:9;padding:14px 4px;display:grid;grid-template-columns:400px 1fr;gap:26px;overflow:auto}
#help h2{font-size:24px;font-weight:900;margin:0 0 8px 0}
#help table{border-collapse:collapse;font-size:14.5px;line-height:1.3;width:100%}
#help td,#help th{border-bottom:1px solid var(--line);padding:3px 8px 3px 0;text-align:left;vertical-align:top}
#help th{border-bottom:2px solid var(--ink)}
kbd{font-family:inherit;font-weight:800;border:2px solid var(--ink);padding:0 5px;font-size:13px;white-space:nowrap}

#poster{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

@media print{
  @page{size:A3 landscape;margin:10mm}
  html,body{height:auto;overflow:visible;background:#fff}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #fit{position:static;transform:none!important;float:left;width:250mm}
  #stage{width:250mm;height:auto;overflow:visible;background:#fff}
  #mast,#card,#detail,#foot,#notes,#help,#band{display:none!important}
  #radarWrap{position:static;width:250mm;height:250mm;opacity:1!important}
  #under{position:static;width:250mm;height:auto}
  #legend{display:grid!important;font-size:9pt}
  .blip,.qarc{opacity:1!important}
  #poster{position:static;width:auto;height:auto;overflow:visible;clip:auto;margin-left:256mm}
  #poster h2{font-size:20pt;font-weight:900;margin:0 0 2mm 0}
  #poster p{font-size:8pt;margin:0 0 2mm 0}
  #poster table{border-collapse:collapse;width:100%;font-size:6.6pt;line-height:1.22}
  #poster th,#poster td{border-bottom:.3pt solid #999;padding:.5mm 1mm .5mm 0;text-align:left;vertical-align:top}
  #poster th{border-bottom:1pt solid #000}
  #poster .pl{display:none}
}
</style>
</head>
<body>
<div id="fit"><div id="stage">
  <header id="mast">
    <h1>TECHRADAR 결정 지도</h1>
    <span class="sub">제1호 · 2026-11-23 · 7일 동안 팀이 내린 결정 <span id="blipCount"></span>개</span>
    <nav id="acts" aria-label="막 이동"></nav>
    <button id="modeBtn" type="button" aria-pressed="false">X 탐색</button>
  </header>

  <div id="radarWrap"><svg id="radar" viewBox="0 0 720 720" role="group" aria-label="결정 레이더. 같은 내용의 표가 문서 끝에 있습니다."></svg></div>

  <div id="under">
    <div id="legend"></div>
    <div id="band" hidden role="group" aria-label="날짜 띠: 날짜별 합친 PR 수"></div>
  </div>

  <main id="card" aria-live="polite"></main>
  <aside id="detail" hidden aria-label="점 카드"></aside>
  <div id="notes" hidden></div>
  <div id="help" hidden></div>

  <footer id="foot">
    <span id="spk"></span>
    <span id="hand"></span>
    <span id="pos"></span>
    <span id="timer" title="T 시작/멈춤 · 0 처음으로">0:00</span>
    <span id="keys">→ ← · 1~7 막 · X 탐색 · T N S E · ?</span>
  </footer>
</div></div>

<section id="poster" aria-label="레이더의 모든 점 목록"></section>

var CX=360,CY=360, RING=[[0,150],[150,226],[226,286],[286,340]], LANES=[[124,90,56],[207,171],[256],[313]];
var QANG=[180,270,0,90];
function pol(r,deg){var a=deg*Math.PI/180;return [CX+r*Math.cos(a),CY+r*Math.sin(a)];}
function layout(){
  var groups={};
  function add(q,r,item){var k=q+'-'+r;(groups[k]=groups[k]||[]).push(item);}
  B.forEach(function(b){add(b.q,b.r,{b:b,ghost:false}); if(b.from)add(b.q,b.from.r,{b:b,ghost:true});});
  Object.keys(groups).forEach(function(k){
    var q=+k.split('-')[0], r=+k.split('-')[1], items=groups[k], lanes=LANES[r], rest=items.slice(), li=0;
    var per=Math.ceil(items.length/lanes.length);
    lanes.forEach(function(rad,idx){
      if(!rest.length)return;
      var m=Math.asin(24/rad)*180/Math.PI, span=90-2*m, cap=Math.max(1,Math.floor(span*Math.PI/180*rad/31));
      var want=(idx===lanes.length-1)?rest.length:Math.min(cap,Math.max(per,rest.length-capRest(lanes,idx+1)));
      var take=rest.splice(0,Math.min(want,rest.length));
      take.forEach(function(it,i){
        var ang=QANG[q]+m+(i+.5)*span/take.length, p=pol(rad,ang);
        if(it.ghost){it.b.gx=p[0];it.b.gy=p[1];}else{it.b.x=p[0];it.b.y=p[1];}
      });
    });
  });
  function capRest(lanes,from){var s=0;for(var i=from;i<lanes.length;i++){var m=Math.asin(24/lanes[i]);s+=Math.max(1,Math.floor((Math.PI/2-2*m)*lanes[i]/31));}return s;}
}

function shape(q,x,y,r,extra){
  extra=extra||'';
  if(q===0)return '<circle class="shape" cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+r+'" '+extra+'/>';
  if(q===1){var s=r*.9;return '<rect class="shape" x="'+(x-s).toFixed(1)+'" y="'+(y-s).toFixed(1)+'" width="'+(2*s)+'" height="'+(2*s)+'" '+extra+'/>';}
  var pts=[],n=q===2?4:6,rr=q===2?r*1.18:r*1.08,off=q===2?0:30;
  for(var i=0;i<n;i++){var a=(off+i*360/n)*Math.PI/180;pts.push((x+rr*Math.cos(a)).toFixed(1)+','+(y+rr*Math.sin(a)).toFixed(1));}
  return '<polygon class="shape" points="'+pts.join(' ')+'" '+extra+'/>';
}
function arcPath(r0,r1,a0,a1){
  var p1=pol(r1,a0),p2=pol(r1,a1),p3=pol(r0,a1),p4=pol(r0,a0);
  return 'M'+p1+' A'+r1+' '+r1+' 0 0 1 '+p2+' L'+p3+(r0>0?' A'+r0+' '+r0+' 0 0 0 '+p4:'')+' Z';
}

  body:function(){return '<div class="shots"><figure><img src="images/flow-sim-success-1120.png" alt="흐름 화면: 시뮬레이터가 쏜 사건이 끝까지 돈 실행 기록"><figcaption>11-20 운영 실제 실행 · 성공 (11-23 테마 변경 전 화면)</figcaption></figure><figure><img src="images/flow-fail-demo-1120.png" alt="흐름 화면: 실패한 단계가 빨간 상자로 보이는 실행 기록"><figcaption>11-20 운영 실제 실행 · 일부러 실패, 빨간 상자</figcaption></figure></div><p class="small">순서: 시뮬레이터에서 가짜 사건 하나 → 흐름 화면에서 단계가 채워지는 것. 주의: 같은 입력은 하루 1번만 대응안 초안이 나온다. 운영에서는 실패 시연 ①②⑤가 꺼져 있다.</p>';},
  src:'docs/images/flow-*-1120.png · docs/flow.md 115 · 119줄 · sim/README.md 21줄 · CLAUDE.md 불변 규칙 6',
  hand:'알림은 재웅 님이 설명합니다.',
  note:'강사 공지 "자동화 흐름 화면". 운영 주소로 한다. 시뮬레이터를 돌렸다 지우고 다시 돌리면 초안이 안 나오니 리허설 입력과 다른 입력을 쓴다. 막히면 이 캡처 두 장으로 말한다.'},
 {a:3,t:30,sp:'J',front:true,hc:'m',h:'시연 2 · 알림 상세 → 판단 저장 → 지난 판단',hi:['judge','three','scen'],
  body:function(){return '<ol><li>방금 생긴 알림을 연다: 무엇이 바뀌었고 왜 울렸는지.</li><li>판단을 저장한다: 저장하기 전에는 아무것도 바뀌지 않는다.</li><li>지난 판단에서 과거 기록을 찾는다.</li></ol><p class="small">주의: 관리자는 남의 알림을 볼 수 없다. 시연 계정으로 로그인한 브라우저를 미리 열어 둔다(#185).</p>';},
  src:'CLAUDE.md 불변 규칙 1 · ADR 0016 · #43 · #185',
  hand:'지도와 청사진은 영식 님이 설명합니다.',

 {a:3,t:60,sp:'Y',front:true,hc:'m',h:'시연 3 · 지도 → 청사진 → 설치 프롬프트',hi:['map','concept','prompt','board'],

 {a:3,t:60,sp:'S',front:true,hc:'m',h:'시연 4 · 위키 챗봇에게 Q5를 묻는다',hi:['wiki'],

  hand:'숫자는 재웅 님이 정리합니다.',
  note:'강사 공지 "md 기반 LLM 위키 시연". 틀리면 틀린 대로 보여 주고 ⑥에서 이유를 말한다.'},

 {a:4,t:25,sp:'J',hc:'m',h:'시험은 통과했는데 운영에서 깨진 것들',hi:['migr','taste','errzero','review'],

 {a:5,t:25,sp:'S',hc:'m',h:'셋이 같은 규칙으로 일하고, 전부 적었다',hi:['area','pr1','union','precheck','actions'],
  body:function(){return '<ul><li>영역으로 나누고, 공용 파일은 주인을 정했다(lib/server 뼈대는 김영식, flow/flow.json은 차세일).</li><li>조각 하나 = 브랜치 하나, 만든 사람이 아닌 1명의 승인.</li><li>요구마다 출처 ID를 달고 PR 설명에 어느 문서의 어느 요구인지 쓴다.</li><li>기록 문서 5개는 합쳐도 충돌하지 않게(merge=union).</li></ul><div class="nums"><div><b>280</b>작업 의도(intent)</div><div><b>45</b>ADR</div><div><b>168</b>서브에이전트 기록 행</div><div><b>122</b>커넥터 기록 행</div><div><b>55</b>오류 기록 행</div></div>';},

 {a:5,t:25,sp:'S',hc:'m',h:'규칙을 만들고도 네 번 더 깨졌다. 그래서 실패로 바꿨다',hi:['migr','precheck','multi'],
  body:function(){return '<div class="steps6"><div class="bad"><b>1 장애 18분</b>11-19 #133. 코드가 마이그레이션보다 먼저</div><div><b>2 고침</b>#135. 칸 없음 오류만 그 부분을 끔</div><div><b>3 규칙</b>#138. 합치기 전에 운영 먼저</div><div><b>4 도구</b>#156. precheck가 경고</div><div class="bad"><b>5 네 번 더</b>#178 · #182 · #184/#187 · #215</div><div class="ok"><b>6 실패로</b>11-22. 번호 겹침은 종료 코드 1</div></div><p>경고만으로는 못 막는다는 것을 확인했다. 실패로 바꾼 것은 번호 겹침뿐이고, 순서 자체를 막는 장치는 아직 없다.</p>';},

 {a:5,t:20,sp:'S',hc:'m',h:'AI에게 맡기되, 확인한 뒤에만 합쳤다',hi:['multi','loop','ai'],
  body:function(){return '<ul><li><b>서브에이전트</b> 기록 168행. 만드는 도우미와 검토하는 도우미를 나눴다.</li><li><b>다중 세션</b> Maestro(정리 · 배정) · FrontLead · DevAssi · DataCollector · DocsChecker. 주로 김영식 쪽 세션의 방식이다.</li><li><b>품질 루프</b> 영역 C만, 최대 3바퀴, 서브에이전트 11개.</li></ul><p><span class="tag k">잘 안 된 점</span>같은 기능을 두 세션이 따로 만들어 13파일이 충돌했고(11-20), 마이그레이션 번호가 두 번 겹쳤다(11-21 · 22).</p>';},
  src:'docs/agents.md 5 · 141~163줄 · docs/quality-loop/README.md 4~22줄 · docs/debug-note.md:46 · 49 · 50',

 {a:5,t:20,sp:'S',hc:'m',h:'챗봇이 틀린 답을 했고, 원인을 처음엔 잘못 짚었다',hi:['wiki'],

var state={i:0,day:REVEAL?6:0,explore:false,sel:null,fq:null,fr:null,fw:null,notes:false,help:false,spk:true,edit:false,t0:null,acc:0};
var $=function(id){return document.getElementById(id);};
var stage=$('stage');

function fit(){var s=Math.min(innerWidth/1600,innerHeight/900);var f=$('fit');f.style.transform='scale('+s+')';f.style.left=((innerWidth-1600*s)/2)+'px';f.style.top=((innerHeight-900*s)/2)+'px';}
addEventListener('resize',fit);fit();

(function(){var h='';ACTS.forEach(function(a,i){h+='<button type="button" data-act="'+i+'">'+a.n+'<small>'+(a.t/60)+'분</small></button>';});$('acts').innerHTML=h;})();

function litKeys(){
  if(state.explore){return B.filter(function(b){return (state.fq===null||b.q===state.fq)&&(state.fr===null||b.r===state.fr)&&(state.fw===null||b.who.indexOf(state.fw)>=0);}).map(function(b){return b.k;});}
  var s=STEPS[state.i];
  if(s.hi==='all')return B.map(function(b){return b.k;});
  if(s.hi==='none')return [];
  if(s.hi==='timeline')return B.filter(function(b){return di(b.date)===state.day;}).map(function(b){return b.k;});
  return s.hi;
}
function paint(){
  var s=STEPS[state.i], lit=litKeys(), tl=!state.explore&&s.timeline, d=state.day;
  document.querySelectorAll('#radar .blip').forEach(function(g){
    var ghost=g.classList.contains('ghost'), b=BK[ghost?g.getAttribute('data-g'):g.getAttribute('data-k')], c='';
    if(tl){
      var born=di(b.date), gborn=b.from?di(b.from.d):99;
      if(ghost){ c = d<gborn?'off':(d<born?(d===gborn?'':'mid'):'mid'); g.querySelector('.gl').style.display=d<born?'none':''; }
      else c = d<born?'off':(d===born?'':'mid');
    }else{
      if(ghost){g.querySelector('.gl').style.display='';c=lit.indexOf(b.k)>=0?'':'dim';}
      else c=lit.indexOf(b.k)>=0?'':'dim';
    }
    g.setAttribute('class','blip'+(ghost?' ghost':'')+(c?' '+c:'')+(!ghost&&state.sel===b.k?' sel':''));
    if(!ghost)g.setAttribute('tabindex',state.explore&&!c?'0':'-1');
  });
  var ring=state.explore?state.fr:(s.ring!==undefined?s.ring:null);
  document.querySelectorAll('.ringfill').forEach(function(c){var r=+c.getAttribute('data-r');c.setAttribute('class','ringfill'+(ring!==null&&r===ring?' lit':''));});
  /* 고리 채움은 겹치므로: 켜진 고리 안쪽은 종이색으로 다시 덮는다 */
  document.querySelectorAll('.ringfill').forEach(function(c){var r=+c.getAttribute('data-r');if(ring!==null&&r<ring)c.style.fill='#FAFAF6';else c.style.fill='';});
  var quads=state.explore?(state.fq===null?null:[state.fq]):(s.quads||null);
  document.querySelectorAll('.qarc').forEach(function(a){var q=+a.getAttribute('data-q');a.setAttribute('class','qarc'+(quads&&quads.indexOf(q)<0?' dim':''));});
}
function chipFor(b){return '<button type="button" class="chip" data-open="'+b.k+'"><span class="no c'+b.q+'">'+b.no+'</span>'+esc(b.name.length>22?b.name.slice(0,21)+'…':b.name)+(b.isNew?' ▲':'')+(b.from?' ◐':'')+'</button>';}
function renderCard(){
  var c=$('card'), s=STEPS[state.i];
  stage.classList.toggle('front',!state.explore&&!!s.front);
  stage.classList.toggle('editing',state.edit);
  if(state.explore){
    var lit=litKeys(), h='<div class="eyebrow"><span class="act">탐색 모드</span><span class="sec">질문 받을 때 · 걸러서 점을 누른다 · X로 발표 순서로 돌아간다</span></div><div class="filters">';
    h+='<span>사분면</span><div class="row">'+Q.map(function(q,i){return '<button type="button" class="chip" data-f="q" data-v="'+i+'" aria-pressed="'+(state.fq===i)+'"><span class="no c'+i+'">'+(i+1)+'</span>'+q.n.slice(2)+' <small>('+q.shape+')</small></button>';}).join('')+'</div>';
    h+='<span>고리</span><div class="row">'+R.map(function(r,i){return '<button type="button" class="chip" data-f="r" data-v="'+i+'" aria-pressed="'+(state.fr===i)+'">&nbsp;'+r.n+'</button>';}).join('')+'</div>';
    h+='<span>사람</span><div class="row">'+['Y','J','S'].map(function(w){return '<button type="button" class="chip" data-f="w" data-v="'+w+'" aria-pressed="'+(state.fw===w)+'">&nbsp;'+WHO[w]+'</button>';}).join('')+'<button type="button" class="chip" data-f="clear">&nbsp;모두 보기</button></div></div>';
    h+='<div class="small" style="font-weight:800;color:var(--ink)">'+lit.length+'개의 점</div><div id="xlist">'+lit.map(function(k){var b=BK[k];return '<button type="button" data-open="'+k+'" aria-current="'+(state.sel===k)+'" title="'+esc(b.name)+'"><span class="no c'+b.q+'">'+b.no+'</span><span class="nm">'+esc(b.name)+'</span></button>';}).join('')+'</div>';
    c.innerHTML=h;
  }else{
    var inAct=STEPS.filter(function(x){return x.a===s.a;}), idx=inAct.indexOf(s)+1;
    var h2='<div class="eyebrow"><span class="act">'+ACTS[s.a].n+'</span><span class="sec">'+idx+' / '+inAct.length+' · 목표 '+s.t+'초'+(s.timeline?' · '+(state.day+1)+' / 7일째':'')+'</span></div><h2 class="'+(s.hc||'')+'">'+s.h+'</h2><div class="body">'+s.body()+'</div>';
    var lit2=(s.hi==='all'||s.hi==='none')?[]:litKeys();
    if(lit2.length)h2+='<div class="lit"><span class="cap">'+(s.timeline?'이날 생긴 점':'비추는 점')+'</span>'+lit2.map(function(k){return chipFor(BK[k]);}).join('')+'</div>';
    h2+='<div class="src">출처: '+s.src+'</div>';
    c.innerHTML=h2;
  }
  c.querySelectorAll('.ed').forEach(function(e){e.contentEditable=state.edit?'true':'false';if(state.edit)e.setAttribute('role','textbox');});
}
function renderBand(){
  var s=STEPS[state.i], on=!state.explore&&!!s.timeline;
  $('band').hidden=!on;$('legend').style.display=on?'none':'';
  if(!on)return;
  var h='';DAYS.forEach(function(d,i){var ht=Math.max(3,Math.round(PRS[i]/79*46));
    h+='<button type="button" data-day="'+i+'" class="'+(i<state.day?'past':'')+'" aria-current="'+(i===state.day)+'" aria-label="'+d+' 합친 PR '+PRS[i]+'개"><span class="lab">'+d+' '+DOW[i]+'<small>PR '+PRS[i]+'</small></span><span class="bar" style="height:'+ht+'px"></span></button>';});
  $('band').innerHTML=h;
}
function spName(sp){return sp.split('').map(function(c){return WHO[c];}).join(' → ');}
function fmt(sec){sec=Math.max(0,Math.floor(sec));return Math.floor(sec/60)+':'+('0'+sec%60).slice(-2);}
function elapsed(){return state.acc+(state.t0?(Date.now()-state.t0)/1000:0);}
function renderFoot(){
  var s=STEPS[state.i];
  $('spk').textContent=state.explore?'질문 · 탐색':'말하는 사람 '+spName(s.sp);
  $('hand').textContent=(!state.explore&&state.spk&&s.hand)?'넘김 문장(제안): "'+s.hand+'"':'';
  var cum=0;for(var i=0;i<=state.i;i++)cum+=STEPS[i].t;
  $('pos').textContent=(state.i+1)+' / '+STEPS.length+' · '+ACTS[s.a].n;
  var e=elapsed(),t=$('timer');
  t.textContent=fmt(e)+' / 여기까지 '+fmt(cum);
  t.className=(state.t0?'run':'')+(e>cum+15?' over':'');
  document.querySelectorAll('#acts button').forEach(function(b){b.setAttribute('aria-current',String(!state.explore&&+b.getAttribute('data-act')===s.a));});
  $('modeBtn').setAttribute('aria-pressed',String(state.explore));
  $('modeBtn').textContent=state.explore?'X 발표 순서로':'X 탐색';
}
setInterval(function(){if(state.t0)renderFoot();},1000);
function renderDetail(){
  var d=$('detail');
  if(!state.sel){d.hidden=true;return;}
  var b=BK[state.sel];
  d.innerHTML='<button type="button" class="x" data-close="1" aria-label="점 카드 닫기">닫기 Esc</button><h3><span class="chip c'+b.q+'" style="border-color:#111;font-size:18px;padding:0 7px;vertical-align:3px">'+b.no+'</span> '+esc(b.name)+(b.isNew?' ▲':'')+(b.from?' ◐':'')+'</h3><p>'+esc(b.line)+'</p><dl><dt>고리</dt><dd><b>'+R[b.r].n+'</b> · '+R[b.r].d+'</dd><dt>사분면</dt><dd>'+Q[b.q].n+'</dd><dt>날짜</dt><dd>'+b.date+(b.isNew?' (새로 들어온 점)':'')+'</dd><dt>사람</dt><dd>'+whoText(b)+'</dd><dt>근거</dt><dd style="grid-column:2/5">'+esc(b.ev)+'</dd>'+(b.from?'<dt>옮김</dt><dd style="grid-column:2/5">'+esc(b.from.why)+'</dd>':'')+'</dl>';
  d.hidden=false;
}
function renderNotes(){
  var n=$('notes'),s=STEPS[state.i];
  n.hidden=!state.notes||state.explore;
  if(!n.hidden)n.innerHTML='<b>발표자 메모 · '+ACTS[s.a].n+'</b><br>'+s.note;
}
function renderHelp(){
  var h=$('help');h.hidden=!state.help;if(h.hidden||h.innerHTML)return;
  var keys=[['→ · Space','다음 (타임라인에서는 다음 날)'],['←','이전'],['1 ~ 7','막으로 이동'],['X','탐색 모드: 사분면 · 고리 · 사람 필터, 점 누르기 / Tab'],['T','경과 시간 시작 · 멈춤 (0: 처음으로)'],['N','발표자 메모'],['S','화자 넘김 문장 보이기 · 숨기기'],['E','사람이 채울 칸 편집 (이 브라우저에 저장)'],['Esc','점 카드 · 메모 · 도움말 닫기'],['?','이 도움말'],['주소','#s5 · #s16-3(타임라인 3일째) · #x(탐색). ?reveal=all 은 연출 끝 상태']];
  var map=[['문제(가장 크게)','① 문제'],['지켜본 곳과 데이터','② 만든 것'],['직접 입력과 운영 화면','② 만든 것 · ④ 시연 3'],['사건과 대응','③ 사건과 대응'],['시연: 성공','④ 시연 1'],['시연: 일부러 실패','④ 시연 1(빨간 상자)'],['시연: 과거 기록 찾기','④ 시연 2(지난 판단)'],['확인','⑤ 확인'],['커넥터','⑤ 확인(말로 짧게)'],['문서 위키와 챗봇','④ 시연 4 · ⑥ 틀린 답 Q5'],['서브에이전트','⑥ AI에게 맡기되'],['하네스','⑥ 규칙을 만들고도'],['팀원별 기여','⑦ 사람'],['다음에 해 볼 것','⑦ 다음 호 레이더'],['공지: 바이브로그를 슬라이드에','⑥ 7일 타임라인(11-18 · 11-19 · 11-23)'],['공지: 자동화 흐름 화면','④ 시연 1'],['공지: md 기반 LLM 위키 시연','④ 시연 4'],['공지: 제품 시연 · 12~15분','④ 시연 4분 · 전체 13.5분 + 여유 1.5분']];
  h.innerHTML='<div><h2>조작 키</h2><table>'+keys.map(function(k){return '<tr><td><kbd>'+k[0]+'</kbd></td><td>'+k[1]+'</td></tr>';}).join('')+'</table><p style="font-size:14px;line-height:1.4">구성: 11-23 화이트보드 v2 7막 기준. 화자와 시간은 그 표를 따랐고, 넘김 문장은 제안이다.</p></div><div><h2>안내서 11장 12항목 + 강사 공지 4항목 ↔ 막</h2><table><tr><th>항목</th><th>어느 막에 있나</th></tr>'+map.map(function(m){return '<tr><td>'+m[0]+'</td><td>'+m[1]+'</td></tr>';}).join('')+'</table><h2 style="margin-top:12px">7막</h2><table><tr><th>막</th><th>말하는 사람</th><th>시간</th></tr>'+ACTS.map(function(a){return '<tr><td>'+a.n+'</td><td>'+a.sp+'</td><td>'+(a.t/60)+'분</td></tr>';}).join('')+'</table></div>';
}
function setHash(){
  var s=STEPS[state.i],h=state.explore?'x':'s'+(state.i+1)+(s.timeline?'-'+(state.day+1):'');
  try{history.replaceState(null,'',location.pathname+location.search+'#'+h);}catch(e){location.hash=h;}
}
function render(){paint();renderCard();renderBand();renderFoot();renderDetail();renderNotes();renderHelp();setHash();}
function go(i,fromBack){
  i=Math.max(0,Math.min(STEPS.length-1,i));
  state.i=i;state.sel=null;
  if(STEPS[i].timeline)state.day=(fromBack||REVEAL)?6:0;
  render();
}
function next(){var s=STEPS[state.i];if(state.explore)return;if(s.timeline&&state.day<6){state.day++;state.sel=null;render();return;}go(state.i+1);}
function prev(){var s=STEPS[state.i];if(state.explore)return;if(s.timeline&&state.day>0){state.day--;state.sel=null;render();return;}go(state.i-1,true);}
function toggleExplore(v){state.explore=v===undefined?!state.explore:v;state.sel=null;render();}
function readHash(){
  var h=location.hash.replace('#','');
  if(h==='x'){state.explore=true;return;}
  var m=/^s(\d+)(?:-(\d+))?$/.exec(h);
  if(m){state.i=Math.max(0,Math.min(STEPS.length-1,+m[1]-1));if(STEPS[state.i].timeline)state.day=m[2]?Math.max(0,Math.min(6,+m[2]-1)):(REVEAL?6:0);}
}
addEventListener('hashchange',function(){state.explore=false;readHash();render();});

/* ───── 입력 ───── */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-open],[data-k],[data-close],[data-act],[data-f],[data-day],#modeBtn');
  if(!t)return;
  if(t.id==='modeBtn'){toggleExplore();return;}
  if(t.hasAttribute('data-close')){state.sel=null;render();return;}
  if(t.hasAttribute('data-act')){state.explore=false;var a=+t.getAttribute('data-act');go(STEPS.findIndex(function(s){return s.a===a;}));return;}
  if(t.hasAttribute('data-day')){state.day=+t.getAttribute('data-day');state.sel=null;render();return;}
  if(t.hasAttribute('data-f')){var f=t.getAttribute('data-f'),v=t.getAttribute('data-v');
    if(f==='clear'){state.fq=state.fr=state.fw=null;}
    else if(f==='w'){state.fw=state.fw===v?null:v;}
    else{v=+v;state['f'+f]=state['f'+f]===v?null:v;}
    state.sel=null;render();var again=document.querySelector('#card [data-f="'+f+'"]'+(v!==null&&f!=='clear'?'[data-v="'+v+'"]':''));if(again)again.focus();return;}
  var k=t.getAttribute('data-open')||t.getAttribute('data-k');
  if(k){state.sel=state.sel===k?null:k;render();}
});
document.addEventListener('input',function(e){var t=e.target.closest&&e.target.closest('.ed');if(t)lsSet(t.getAttribute('data-ed'),t.textContent.trim());});
document.addEventListener('keydown',function(e){
  var inEd=e.target&&e.target.isContentEditable;
  if(inEd){if(e.key==='Escape'){e.target.blur();state.edit=false;render();}return;}
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  var k=e.key;
  if((k==='Enter'||k===' ')&&e.target.closest&&e.target.closest('.blip')){e.preventDefault();var kk=e.target.closest('.blip').getAttribute('data-k');state.sel=state.sel===kk?null:kk;render();var g=document.querySelector('.blip[data-k="'+kk+'"]');if(g)g.focus();return;}
  if((k==='Enter'||k===' ')&&e.target.tagName==='BUTTON')return;
  if(k==='Escape'){if(state.help)state.help=false;else if(state.sel)state.sel=null;else if(state.notes)state.notes=false;else if(state.edit)state.edit=false;render();return;}
  if(k==='?'||(k==='/'&&e.shiftKey)){state.help=!state.help;render();return;}
  if(state.help)return;
  if(k==='ArrowRight'||k===' '||k==='PageDown'){e.preventDefault();next();}
  else if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();prev();}
  else if(k>='1'&&k<='7'){state.explore=false;var a=+k-1;go(STEPS.findIndex(function(s){return s.a===a;}));}
  else if(k==='x'||k==='X'||k==='ㅌ'){toggleExplore();}
  else if(k==='t'||k==='T'||k==='ㅅ'){if(state.t0){state.acc+=(Date.now()-state.t0)/1000;state.t0=null;}else state.t0=Date.now();renderFoot();}
  else if(k==='0'){state.acc=0;state.t0=state.t0?Date.now():null;renderFoot();}
  else if(k==='n'||k==='N'||k==='ㅜ'){state.notes=!state.notes;render();}
  else if(k==='s'||k==='S'||k==='ㄴ'){state.spk=!state.spk;renderFoot();}
  else if(k==='e'||k==='E'||k==='ㄷ'){state.edit=!state.edit;render();if(state.edit){var f=document.querySelector('#card .ed');if(f){e.preventDefault();f.focus();}}}
  else if(k==='Home'){go(0);}
  else if(k==='End'){go(STEPS.length-1);}
});

/* ───── 같은 내용의 표(화면 낭독기 · 인쇄 포스터) ───── */
(function(){
  var h='<h2>TechRadar 결정 지도 · 제1호 (2026-11-23)</h2><p>김영식 · 황재웅 · 차세일. 7일 동안 내린 결정 '+B.length+'개. 고리: 채택(자리 잡은 것) · 시험(해 보는 중) · 평가(근거가 약함) · 보류(접었거나 미뤄 둔 것). ▲ 11-23에 새로 들어온 점, ◐ 고리를 옮긴 점.</p><table><caption class="sr">레이더의 모든 점</caption><tr><th>번호</th><th>이름</th><th>사분면</th><th>고리</th><th>날짜</th><th class="pl">한 줄</th><th>근거</th><th>사람</th></tr>';
  B.forEach(function(b){h+='<tr><td>'+b.no+(b.isNew?' ▲':'')+(b.from?' ◐':'')+'</td><td>'+esc(b.name)+'</td><td>'+Q[b.q].n+'</td><td>'+R[b.r].n+'</td><td>'+b.date+'</td><td class="pl">'+esc(b.line)+(b.from?' ('+esc(b.from.why)+')':'')+'</td><td>'+esc(b.ev)+'</td><td>'+(b.who?whoText(b):'—')+'</td></tr>';});
  $('poster').innerHTML=h+'</table>';
})();

readHash();render();
})();
</script>
</body>
