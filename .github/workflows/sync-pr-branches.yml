# main이 바뀔 때마다 열린 PR 브랜치에 main을 합쳐 푸시한다(ADR 0017 개정).
# GitHub 화면의 병합은 .gitattributes의 merge=union을 무시해서 기록 문서가 충돌로 보인다. 여기서는 진짜 git으로 합친다.
name: PR 브랜치에 main 합치기

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true면 합쳐 보기만 하고 푸시하지 않는다"
        type: boolean
        default: true

# main이 연달아 합쳐져도 한 번에 하나만 돈다. 기다리는 실행은 가장 최근 것 하나만 남는다.
concurrency:
  group: sync-pr-branches
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: 열린 PR 브랜치에 main 합치기
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh pr list --state open --base main --limit 100 --json number,headRefName,isCrossRepository \
            --jq '.[] | select(.isCrossRepository | not) | "\(.number) \(.headRefName)"' \
            | bash .github/scripts/sync-pr-branches.sh
